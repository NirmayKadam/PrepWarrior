spring.application.name=mockinterview

# Database Configuration (PostgreSQL with SSL mode required)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:interviewdb}?sslmode=require
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.h2.console.enabled=false

# Hikari CP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Spring AI Gemini configuration
# If GEMINI_API_KEY environment variable is set, it will automatically populate this value
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# Use standard model
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Logging config
logging.level.org.springframework.ai=DEBUG
